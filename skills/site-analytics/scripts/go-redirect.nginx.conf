# Переходник для партнёрских ссылок: /go/<партнёр>?from=<страница>.<место>
# Пишет каждый клик в отдельный журнал и отдаёт 302 на партнёра.
# Пример, а не готовый файл: подставь свои домены и коды, проверь
# `nginx -t`, потом `systemctl reload nginx`.
#
# Куда класть: log_format в контекст http (например в
# /etc/nginx/conf.d/go-redirect.conf), блоки location внутрь server своего сайта.
#
# Почему не таблица map: на части серверов таблица с длинными адресами не
# собирается («could not build map_hash, increase map_hash_bucket_size»), а
# поправить размер можно только в главном конфиге. Отдельный блок на каждого
# партнёра работает везде. Проверено nginx -t и живым запросом.

# Формат строки журнала. Его же разбирает scripts/clicks_report.py, менять
# согласованно. IP посетителя не пишем: для отчёта он не нужен.
# Страна: за Cloudflare берётся из заголовка CF-IPCountry. Без Cloudflare
# подставь переменную модуля geoip2, если он стоит, или оставь пустой.
log_format goclick '$time_iso8601 to=$uri from=$arg_from country=$http_cf_ipcountry '
                   'ref="$http_referer" ua="$http_user_agent"';

# Реестр партнёров: по блоку на каждого. Ссылка партнёра живёт здесь И в
# данных сайта (если сайт её где-то показывает). Меняешь в одном месте,
# меняй и во втором.
server {
    # ... твои listen, server_name, ssl и остальное ...

    # Отдельный журнал в своём каталоге. Каталог не должен попадать под
    # маску ротации общего лога (обычно /var/log/nginx/*.log), иначе
    # история кликов пропадёт вместе со старым access.log.
    # Создать заранее: mkdir -p /var/log/site-go
    # (журнал открывает главный процесс nginx, отдельные права обычно не нужны).
    #
    # Не кэшировать редирект ни в CDN, ни в браузере: иначе повторный клик
    # не дойдёт до сервера и не попадёт в журнал. Переходник не в индекс.
    # Внимание: add_header внутри location отменяет все add_header уровня
    # server. Если там стоят заголовки безопасности, повтори их здесь.

    location = /go/example {
        access_log /var/log/site-go/clicks.log goclick;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 "https://partner.example.com/?ref=YOUR_CODE";
    }

    location = /go/example-bot {
        access_log /var/log/site-go/clicks.log goclick;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 "https://t.me/example_bot?start=YOUR_CODE";
    }

    # Неизвестное имя после /go/: 404, а не редирект куда попало.
    # Точное совпадение (location =) выше всегда побеждает этот блок.
    location ^~ /go/ {
        return 404;
    }
}

# Проверка после reload (подставь свой домен):
#   curl -sI "https://example.com/go/example?from=test.facts"
#     ждём: 302, Location на партнёра, Cache-Control: no-store, X-Robots-Tag
#   curl -sI "https://example.com/go/nobody"
#     ждём: 404
#   tail -n 2 /var/log/site-go/clicks.log
#     ждём: строку с to=/go/example from=test.facts
# Тестовые строки потом не забудь отличать: метка from=test.* в отчёте видна.
#
# Плюс в robots.txt сайта:
#   Disallow: /go/
